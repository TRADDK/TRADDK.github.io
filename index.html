.screen{position:relative;z-index:1;min-height:100vh;padding:26px clamp(14px,3vw,42px) 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:auto}.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(20px,3vw,34px);text-shadow:0 2px 10px rgba(255,255,255,.8)}.nav-actions{display:flex;gap:8px}.iconbtn{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 7px 22px rgba(0,0,0,.13);font-size:21px}.page{max-width:1180px;margin:28px auto 0}.panel{background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:clamp(18px,3vw,34px);box-shadow:var(--shadow);backdrop-filter:blur(12px)}h1,h2,h3{margin:0 0 12px}p{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.btn{min-height:54px;border-radius:16px;padding:12px 18px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:800;box-shadow:0 5px 16px rgba(0,0,0,.07)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{background:#7a3030;color:#fff}.btn.small{min-height:42px;padding:8px 14px}.field{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #cfd7dc;background:#fff}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0}.label{font-size:13px;font-weight:800;color:#56636d;display:block;margin:0 0 7px}.home-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.stat{padding:18px;border-radius:20px;background:rgba(245,248,249,.92);border:1px solid #dce2e5}.list{display:grid;gap:10px}.item{padding:15px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.tag{font-size:12px;padding:5px 9px;border-radius:999px;background:#e9eff3;color:#4a5d6b}.boardwrap{display:flex;justify-content:center}.board{width:min(88vw,720px);aspect-ratio:1;display:grid;gap:5px;padding:5px;border-radius:22px;background:rgba(26,37,43,.82);box-shadow:0 20px 60px rgba(0,0,0,.24)}.cell{min-width:0;min-height:0;border-radius:10px;background:rgba(250,250,247,.94);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.cell.win{outline:4px solid #f2c94c;z-index:2}.piece{width:78%;height:78%;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,6vw,58px);font-weight:900;line-height:1;filter:drop-shadow(0 7px 6px rgba(0,0,0,.22));user-select:none}.piece.o{color:#b54842}.piece.x{color:#27597a}.gamebar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0}.turn{font-weight:900;text-align:center;font-size:18px}.timer{text-align:center;font-size:28px;font-variant-numeric:tabular-nums;font-weight:900}.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.skin-card{background:#fff;border:2px solid #e0e5e8;border-radius:18px;padding:13px;text-align:center;transition:.15s}.skin-card.active{border-color:#244e69;box-shadow:0 0 0 3px rgba(36,78,105,.12)}.skin-preview{height:105px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#eef2f3,#cfd6d9);margin-bottom:10px;overflow:hidden}.skin-piece{font-size:65px;font-weight:900;line-height:1;filter:drop-shadow(0 9px 7px rgba(0,0,0,.25))}.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.bg-card{height:155px;cursor:pointer;transition:.16s;border-radius:18px;overflow:hidden;position:relative;border:3px solid transparent;box-shadow:0 9px 24px rgba(0,0,0,.12)}.bg-card:hover{transform:translateY(-2px)}.bg-card.active{border-color:#173e58;box-shadow:0 0 0 4px rgba(23,62,88,.14),0 12px 30px rgba(0,0,0,.18)}.bg-thumb{position:absolute;inset:0}.bg-name{position:absolute;left:10px;right:10px;bottom:9px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.4 function normalizeNameForCheck(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[\s_\-\u2010-\u2015\u2212]+/g,'');}
const BLOCKED_NAMES=['うんこ','ウンコ','💩','unko'];
function isBadName(v){const n=normalizeNameForCheck(v);return BLOCKED_NAMES.some(x=>n===normalizeNameForCheck(x)||n.includes(normalizeNameForCheck(x)));}

function roomCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';for(let i=0;i<4;i++)x+=c[Math.floor(Math.random()*c.length)];return x}

function onlineKeyStats(name){return {name:String(name||'').slice(0,20),wins:0,draws:0,losses:0,updatedAt:firebase.database.ServerValue.TIMESTAMP}}

function createOnlineRoom(){if(!firebaseReady()){alert('Firebaseに接続できません。\nFirebase設定またはネット接続を確認してください。');return}const code=roomCode();const ref=window.MARUBATSU_DB.ref('rooms/'+code);ref.set(roomBase(code)).then(()=>{state.onlineRoom=code;state.onlineRole='host';state.mode='online';state.page='online';state._onlineResultShown=false;save();render();onlineRoomListen()}).catch(e=>{console.error(e);alert('部屋を作成できませんでした。\n'+(e.message||e))})}

function onlineMove(i){if(!state.active||!onlineLastSnapshot||state.board[i]||winning.length)return;const myTurn=state.onlineRole==='host'?state.turn===0:state.turn===1;if(!myTurn)return;const b=state.board.slice(),v=state.turn===0?'X':'O';b[i]=v;const w=checkWin(b,v);const patch={board:b};if(w)Object.assign(patch,{winning:w,result:v,active:false,timerRemaining:currentRemaining(),timerStartedAt:null});else if(b.every(Boolean))Object.assign(patch,{winning:[],result:'draw',active:false,timerRemaining:currentRemaining(),timerStartedAt:null});else Object.assign(patch,{turn:1-state.turn,timerRemaining:60,timerStartedAt:firebase.database.ServerValue.TIMESTAMP});updateOnlineRoom(patch)}

function onlinePage(p){const d=onlineLastSnapshot||{},own=state.onlineRole==='host'?d.hostName||'':d.guestName||'',other=state.onlineRole==='host'?d.guestName||'':d.hostName||'';p.innerHTML=`<section class="panel"><h2>🌐 オンライン対戦</h2><div class="notice"><b>ルームコード</b><div class="online-code" style="font-size:2.4rem;letter-spacing:.18em;text-align:center;font-weight:800;margin:.6rem 0">${esc(state.onlineRoom||'----')}</div><div style="text-align:center">この4文字を相手の端末に入力してもらってください。</div></div><div class="formgrid"><div><label class="label">あなたの名前</label><input class="field" id="onlineName" maxlength="20" value="${esc(own)}" placeholder="自分の名前を入力"><div class="muted">この名前はオンラインランキングに表示されます。</div></div><div><label class="label">相手</label><div class="field">${other?esc(other):'相手の参加を待っています…'}</div><div class="muted">${state.onlineConnected?'接続中':'未接続'}</div></div></div><div class="gamebar"><button class="btn primary" id="saveOnlineName">名前を登録</button><button class="btn" id="onlineSkin">駒を着せ替える</button>${state.onlineRole==='host'?'<button class="btn" id="startOnline">対局開始</button>':''}<button class="btn danger" id="leaveOnline">ルームを終了</button></div></section>`;by('saveOnlineName',()=>setOnlineOwnName(document.getElementById('onlineName').value.trim()));by('onlineSkin',()=>{state.previous='online';state.page='skins';render();save()});by('startOnline',startOnlineMatch);by('leaveOnline',()=>{if(confirm('このルームを終了しますか？')){window.MARUBATSU_DB.ref('rooms/'+state.onlineRoom).remove().finally(()=>{cleanupOnline();state.onlineRoom=null;state.onlineRole=null;state.page='setup';render();save()})}})}

function setup(p){p.innerHTML=`<section class="panel"><h2>新しい対局</h2><div class="formgrid"><div><label class="label">対戦方式</label><select class="field" id="mode"><option value="ai">1人でAIと対戦</option><option value="local">📱 端末のみ・2人対戦</option><option value="online">🌐 2台2人対戦</option></select></div><div><label class="label">盤面</label><select class="field" id="size">${[3,4,5,6,7].map(n=>`<option ${n===state.size?'selected':''}>${n}</option>`).join('')}</select></div><div><label class="label">勝利ライン</label><select class="field" id="win"></select></div><div id="p1wrap"><label class="label">プレイヤー1</label><input class="field" id="p1" maxlength="20" placeholder="プレイヤーの名前を入力"><div class="muted">この名前はランキングに表示されます。</div></div><div id="p2wrap"><label class="label">プレイヤー2</label><input class="field" id="p2" maxlength="20" placeholder="プレイヤー2の名前を入力"><div class="muted">この名前はランキングに表示されます。</div></div></div><div id="onlineInfo" class="notice" style="display:none">🌐 ルームを作成／参加してから、それぞれ自分の名前を登録します。</div><div class="gamebar"><button class="btn primary" id="start">対局開始</button><button class="btn" id="cancel">戻る</button></div></section>`;const mode=document.getElementById('mode'),size=document.getElementById('size'),win=document.getElementById('win'),p1w=document.getElementById('p1wrap'),p2w=document.getElementById('p2wrap'),oi=document.getElementById('onlineInfo');function opts(){const n=+size.value,a=n<=5?[3,4,5].filter(v=>v<=n):[5,6,7].filter(v=>v<=n);win.innerHTML=a.map(v=>`<option ${v===Math.min(state.win,n)?'selected':''}>${v}</option>`).join('')}opts();size.onchange=opts;mode.onchange=()=>{p1w.style.display=mode.value==='online'?'none':'block';p2w.style.display=mode.value==='local'?'block':'none';oi.style.display=mode.value==='online'?'block':'none'};mode.onchange();by('cancel',()=>setPage('home'));by('start',()=>{if(mode.value==='online'){state.size=+size.value;state.win=+win.value;save();openOnlineLobby();return}const n1=document.getElementById('p1').value.trim()||'プレイヤー1',n2=mode.value==='local'?(document.getElementById('p2').value.trim()||'プレイヤー2'):'AI',e1=validatePlayerName(n1),e2=mode.value==='local'?validatePlayerName(n2):'';if(e1){alert(e1);return}if(e2){alert(e2);return}cleanupOnline();clearInterval(timer);state.mode=mode.value;state.size=+size.value;state.win=+win.value;state.p1=n1;state.p2=n2;state.turn=state.starter;state.board=Array(state.size*state.size).fill('');state.active=true;state.result=null;winning=[];state.timerRemaining=60;state.timerStartedAt=Date.now();setPage('game');syncClock();if(state.mode==='ai'&&state.turn===1)setTimeout(aiMove,350)})}
function game(p){const n=state.size;const cells=state.board.map((v,i)=>`<button class="cell ${winning.includes(i)?'win':''}" data-i="${i}" ${v?'disabled':''}>${v?piece(v):''}</button>`).join('');p.innerHTML=`<section class="panel"><div class="gamebar"><span class="tag">${state.mode==='ai'?'1人対AI':state.mode==='online'?'🌐 2台2人対戦':'📱 端末のみ'}</span><span class="tag">${n}×${n}</span><span class="tag">${state.win}つ揃え</span></div><div class="turn">${state.turn===0?(state.p1||'プレイヤー1'):(state.p2||'AI')} の番</div><div class="timer" id="timer">01:00</div><div class="notice" style="text-align:center">1手につき60秒。時間切れになると相手の勝利です。</div><div class="boardwrap"><div class="board" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${cells}</div></div><div class="gamebar"><button class="btn" id="skin">駒を着せ替える</button><button class="btn" id="bg">背景を着せ替える</button><button class="btn" id="quick">簡単設定</button><button class="btn" id="exit">対局を終了</button></div></section>`;p.querySelectorAll('.cell').forEach(c=>c.addEventListener('click',()=>state.mode==='online'?onlineMove(+c.dataset.i):move(+c.dataset.i)));by('skin',()=>setPage('skins'));by('bg',()=>setPage('backgrounds'));by('quick',openQuick);by('exit',confirmExit);syncClock()}
function piece(v){const id=v==='X'?(state.skin||'classicO'):(state.skin2||'classicX');return `<span class="piece ${v==='X'?'p1':'p2'}" data-illustration="${id}" aria-label="${emojiMap[id]||''}">${emojiMap[id]||'❌'}</span>`}
function move(i){if(!state.active||state.board[i]||winning.length)return;if(state.mode==='ai'&&state.turn===1)return;state.board[i]=state.turn===0?'X':'O';const result=checkWin(state.board,state.board[i]);if(result){winning=result;finish(state.board[i]);return}if(state.board.every(Boolean)){finish('draw');return}state.turn=1-state.turn;state.timerRemaining=60;state.timerStartedAt=Date.now();render();save();if(state.mode==='ai'&&state.turn===1)setTimeout(aiMove,300)}
function checkWin(b,v){const n=state.size,k=state.win;for(let r=0;r<n;r++)for(let c=0;c<n;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const arr=[];for(let q=0;q<k;q++){const rr=r+dr*q,cc=c+dc*q;if(rr<0||rr>=n||cc<0||cc>=n)break;const idx=rr*n+cc;if(b[idx]!==v)break;arr.push(idx)}if(arr.length===k)return arr}return null}
function aiMove(){if(!state.active||state.page!=='game'||state.turn!==1||winning.length)return;const b=state.board,n=state.size;let best=-1;for(let i=0;i<b.length;i++)if(!b[i]){b[i]='O';if(checkWin(b,'O')){best=i;b[i]='';break}b[i]=''}if(best<0)for(let i=0;i<b.length;i++)if(!b[i]){b[i]='X';if(checkWin(b,'X')){best=i;b[i]='';break}b[i]=''}if(best<0){const free=b.map((v,i)=>v?null:i).filter(i=>i!==null);best=free[Math.floor(Math.random()*free.length)]}if(best==null)return;b[best]='O';const result=checkWin(b,'O');if(result){winning=result;finish('O');return}if(b.every(Boolean)){finish('draw');return}state.turn=0;state.timerRemaining=60;state.timerStartedAt=Date.now();render();save()}
function currentRemaining(){if(!state.active)return state.timerRemaining??60;if(!state.timerStartedAt)return state.timerRemaining??60;return Math.max(0,(state.timerRemaining??60)-Math.floor((Date.now()-state.timerStartedAt)/1000))}
function updateTimerDisplay(){const el=document.getElementById('timer');if(el){const sec=currentRemaining();el.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;el.style.color=sec<=10?'#a33':''}}
function syncClock(){clearInterval(timer);if(!state.active)return;timer=setInterval(()=>{if(state.mode==='online'&&!state.onlineConnected){updateTimerDisplay();return}const rem=currentRemaining();if(rem<=0){state.timerRemaining=0;state.timerStartedAt=null;if(state.mode==='online'){onlineTimeout();return}const loser=state.turn;finish(loser===0?'O':'X');return}updateTimerDisplay();if(rem%5===0)save()},250)}
function finish(v){if(!state.active)return;state.timerRemaining=currentRemaining();clearInterval(timer);state.timerStartedAt=null;state.active=false;state.result=v;state.winning=winning;const winner=v==='X'?state.p1:v==='O'?state.p2:null;if(state.mode==='online'){if(state.onlineRole==='host')pushOnlineResult(v)}else if(v==='draw')state.draws++;else if(v==='X'&&state.mode==='ai')state.wins++;else if(v==='O'&&state.mode==='ai')state.losses++;else if(v==='X')state.wins++;else state.losses++;state.history.unshift({date:new Date().toLocaleString('ja-JP'),result:v==='draw'?'引き分け':winner||'勝利',size:state.size,win:state.win});state.history=state.history.slice(0,100);save();setTimeout(showVictory,50)}
function showVictory(){if(!state.result)return;const v=state.result,winner=v==='X'?state.p1:v==='O'?state.p2:null;const mark=v==='X'?(emojiMap[state.skin]||'🚆'):v==='O'?(emojiMap[state.skin2]||'🚉'):'—';document.getElementById('modalInner').innerHTML=`<div class="confetti">${Array.from({length:18},(_,i)=>`<i style="left:${(i*17)%100}%;animation-delay:${(i%7)*.12}s"></i>`).join('')}</div><div class="victory-mark">${mark}</div><h2 style="text-align:center">${v==='draw'?'引き分け':(winner||'勝利')}！</h2><p style="text-align:center">${v==='draw'?'すべてのマスが埋まりました。':'勝利ラインが揃いました。'}</p><div class="grid"><button class="btn primary" id="again">もう一度対局</button><button class="btn" id="stay">駒を着せ替える</button><button class="btn" id="vrank">ランキングを見る</button><button class="btn" id="vhistory">対局履歴</button><button class="btn danger" id="end">対局を終了</button></div>`;document.getElementById('modal').classList.add('show');by('again',startRematch);by('stay',()=>{closeModal();state.previous='victory';state.page='skins';render();save()});by('vrank',()=>{closeModal();state.previous='victory';state.page='ranking';render();save()});by('vhistory',()=>{closeModal();state.previous='victory';state.page='history';render();save()});by('end',()=>{closeModal();if(state.mode==='online'){cleanupOnline();state.onlineRoom=null;state.onlineRole=null}state.result=null;state.active=false;state.board=[];state.page='home';state.previous='home';render();save()})}
function startRematch(){closeModal();if(state.mode==='online'){if(state.onlineRole!=='host'){alert('ルーム作成側が次の対局を開始します。');return}state.starter=1-state.starter;state._onlineResultShown=false;updateOnlineRoom({board:Array(state.size*state.size).fill(''),starter:state.starter,turn:state.starter,active:true,result:null,winning:[],timerRemaining:60,timerStartedAt:firebase.database.ServerValue.TIMESTAMP});return}state.board=Array(state.size*state.size).fill('');state.starter=1-state.starter;state.turn=state.starter;state.active=true;state.result=null;winning=[];state.winning=[];state.timerRemaining=60;state.timerStartedAt=Date.now();render();save();syncClock();if(state.mode==='ai'&&state.turn===1)setTimeout(aiMove,350)}

  const originalCreate=window.createOnlineRoom;
  function roomBaseV2(code){
    return {code,hostName:'',guestName:'',hostSkin:state.skin||'classicO',guestSkin:'',
      board:Array(state.size*state.size).fill(''),size:state.size,win:state.win,turn:0,starter:0,
      active:false,result:null,winning:[],timerRemaining:60,timerStartedAt:null,
      hostOnline:false,guestOnline:false,rematchHost:false,rematchGuest:false,
      createdAt:firebase.database.ServerValue.TIMESTAMP};
  }
  window.roomBase=roomBaseV2;
  window.createOnlineRoom=function(){
    if(!firebaseReady()){alert('Firebaseに接続できません。\\nFirebase設定またはネット接続を確認してください。');return}
    const code=roomCode();
    window.MARUBATSU_DB.ref('rooms/'+code).set(roomBaseV2(code)).then(()=>{
      state.onlineRoom=code;state.onlineRole='host';state.mode='online';state.page='online';
      state._onlineResultShown=false;state.skinTarget=1;save();render();onlineRoomListen();
    }).catch(e=>{console.error(e);alert('部屋を作成できませんでした。\\n'+(e.message||e))});
  };
  window.onlineRoomListen=function(){
    cleanupOnline(); if(!state.onlineRoom)return;
    onlineRoomRef=window.MARUBATSU_DB.ref('rooms/'+state.onlineRoom);
    onlineRoomHandler=snap=>{
      const d=snap.val();
      if(!d){cleanupOnline();state.onlineRoom=null;state.onlineRole=null;state.page='setup';render();return}
      onlineLastSnapshot=d;
      state.size=Number(d.size||3);state.win=Number(d.win||3);
      state.board=Array.isArray(d.board)?d.board:Object.values(d.board||{});
      state.turn=Number(d.turn||0);state.starter=Number(d.starter||0);
      state.p1=d.hostName||'';state.p2=d.guestName||'';
      if(state.onlineRole==='host'){
        state.skin=d.hostSkin||state.skin||'classicO';
      }else{
        state.skin2=d.guestSkin||state.skin2||'classicX';
      }
      state.active=!!d.active;state.result=d.result||null;
      winning=Array.isArray(d.winning)?d.winning:[];
      state.timerRemaining=Number(d.timerRemaining??60);state.timerStartedAt=d.timerStartedAt||null;
      state.onlineConnected=state.onlineRole==='host'?!!d.guestOnline:!!d.hostOnline;
      if(state.active&&state.page==='online')state.page='game';
      if(state.page==='online'||state.page==='game')render();
      if(d.result&&!state._onlineResultShown){state._onlineResultShown=true;setTimeout(showVictory,40)}
      syncClock();
    };
    onlineRoomRef.on('value',onlineRoomHandler);
    onlinePresenceRef=onlineRoomRef.child(state.onlineRole==='host'?'hostOnline':'guestOnline');
    onlinePresenceRef.set(true);onlinePresenceRef.onDisconnect().set(false);
  };
  window.setOnlineOwnName=function(name){
    const e=validatePlayerName(name);if(e){alert(e);return}
    const k=state.onlineRole==='host'?'hostName':'guestName';
    updateOnlineRoom({[k]:name}).then(()=>{if(state.onlineRole==='host')state.p1=name;else state.p2=name;save()});
  };
  window.setOnlineSkin=function(id){
    if(!state.onlineRoom||!state.onlineRole)return;
    const d=onlineLastSnapshot||{};
    const other=state.onlineRole==='host'?(d.guestSkin||''):(d.hostSkin||'');
    if(other===id){alert('相手が現在この着せ替えを使用しています。別の着せ替えを選んでください。');return}
    const k=state.onlineRole==='host'?'hostSkin':'guestSkin';
    updateOnlineRoom({[k]:id}).then(()=>{if(state.onlineRole==='host')state.skin=id;else state.skin2=id;state.skinCustomized=true;save();render()});
  };
  window.startOnlineMatch=function(){
    if(state.onlineRole!=='host')return;
    const d=onlineLastSnapshot||{};
    if(!d.hostName||!d.guestName){alert('2人とも自分の名前を登録してください。');return}
    if(!d.hostSkin||!d.guestSkin){alert('2人とも駒の着せ替えを設定してください。');return}
    if(d.hostSkin===d.guestSkin){alert('2人の駒が同じです。別々の着せ替えを選んでください。');return}
    state._onlineResultShown=false;
    updateOnlineRoom({board:Array(state.size*state.size).fill(''),size:state.size,win:state.win,
      turn:Number(d.starter||0),starter:Number(d.starter||0),active:true,result:null,winning:[],
      rematchHost:false,rematchGuest:false,timerRemaining:60,timerStartedAt:firebase.database.ServerValue.TIMESTAMP});
  };
  window.startRematch=function(){
    closeModal();
    if(state.mode==='online'){
      const key=state.onlineRole==='host'?'rematchHost':'rematchGuest';
      updateOnlineRoom({[key]:true}).then(()=>{render();save()});
      return;
    }
    state.board=Array(state.size*state.size).fill('');state.starter=1-state.starter;state.turn=state.starter;
    state.active=true;state.result=null;winning=[];state.winning=[];state.timerRemaining=60;state.timerStartedAt=Date.now();
    render();save();syncClock();if(state.mode==='ai'&&state.turn===1)setTimeout(aiMove,350);
  };
  window.skinsPage=function(p){
    const groups=[
      ['すべて',emojiThemes],['クラシック',emojiThemes.filter(x=>x[0].startsWith('classic'))],
      ['鉄道',emojiThemes.filter(x=>['train','shinkansen','station','rail'].includes(x[0]))],
      ['自然',emojiThemes.filter(x=>['maple','cherry','bamboo','flower','leaf','mountain','forest','ocean','sun','moon','star','snow'].includes(x[0]))],
      ['動物',emojiThemes.filter(x=>['cat','dog','fox','bear','bird','deer','wolf','panda','penguin','koala','lion','tiger','horse','whale','dolphin'].includes(x[0]))],
      ['食べ物',emojiThemes.filter(x=>['apple','peach','orange','grape','coffee','cake','bread','ramen','sushi','rice','burger','pizza','donut','icecream','tea','melon','watermelon'].includes(x[0]))],
      ['乗り物',emojiThemes.filter(x=>['airplane','ship','car','bicycle','bus','tram','metro','taxi','motorcycle','helicopter','sailboat','ferry','anchor'].includes(x[0]))],
      ['その他',emojiThemes.filter(x=>!['classicO','classicX','train','shinkansen','station','rail','maple','cherry','bamboo','flower','leaf','mountain','forest','ocean','sun','moon','star','snow','cat','dog','fox','bear','bird','apple','peach','orange','grape','coffee','cake','bread','airplane','ship','car','bicycle'].includes(x[0]))]
    ];
    const online=state.mode==='online'&&!!state.onlineRoom;
    const activePlayer=online?(state.onlineRole==='host'?1:2):(state.skinTarget||1);
    const own=activePlayer===1?state.skin:state.skin2;
    const other=online?(onlineLastSnapshot?(activePlayer===1?onlineLastSnapshot.guestSkin:onlineLastSnapshot.hostSkin):''):(activePlayer===1?state.skin2:state.skin);
    p.innerHTML=`<section class="panel skin-panel">
      <div class="skin-head"><div><h2>駒の着せ替え</h2><p>${online?'あなた専用の着せ替えです。相手と同じ駒は選べません。':'プレイヤーごとに好きな駒へ着せ替えできます。'}</p></div><button class="btn small" id="randomSkin">🎲 おまかせ</button></div>
      ${online?`<div class="notice"><b>あなた：</b>${esc(activePlayer===1?(state.p1||'プレイヤー1'):(state.p2||'プレイヤー2'))}　／　<b>相手：</b>${esc(activePlayer===1?(state.p2||'待機中'):(state.p1||'待機中'))}</div>`:
      `<div class="skin-target"><button class="player-tab ${activePlayer===1?'active':''}" id="target1"><span>${emojiMap[state.skin]||'⭕️'}</span><b>プレイヤー1</b></button><button class="player-tab ${activePlayer===2?'active':''}" id="target2"><span>${emojiMap[state.skin2]||'❌'}</span><b>プレイヤー2</b></button></div>`}
      <div class="skin-cats" id="skinCats">${groups.map((g,i)=>`<button class="catbtn ${i===0?'active':''}" data-cat="${i}">${g[0]}</button>`).join('')}</div>
      <div class="skin-grid" id="skinGrid"></div>
      <div class="gamebar"><button class="btn primary" id="backSkin">${state.previous==='game'?'対局に戻る':state.previous==='victory'?'対局結果へ戻る':state.previous==='online'?'オンラインルームへ戻る':'ホームへ戻る'}</button></div>
    </section>`;
    function draw(groupIndex=0){
      const items=groups[groupIndex][1];
      document.getElementById('skinGrid').innerHTML=items.map(x=>{
        const blocked=online&&other===x[0];
        return `<button class="skin-card ${own===x[0]?'active':''}" data-skin="${x[0]}" ${blocked?'disabled':''} style="${blocked?'opacity:.35;cursor:not-allowed':''}"><div class="skin-preview emoji-preview"><span class="skin-symbol skin-${x[0]}">${x[1]}</span></div><b>${x[2]}</b><small>${blocked?'相手が使用中':x[1]}</small></button>`;
      }).join('');
      document.querySelectorAll('[data-skin]').forEach(e=>e.onclick=()=>{
        const id=e.dataset.skin;
        if(online)setOnlineSkin(id);else{if(activePlayer===1)state.skin=id;else state.skin2=id;state.skinCustomized=true;state.skinTarget=activePlayer;save();render()}
      });
    }
    document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));e.classList.add('active');draw(+e.dataset.cat)});
    if(!online){by('target1',()=>{state.skinTarget=1;save();render()});by('target2',()=>{state.skinTarget=2;save();render()})}
    by('randomSkin',()=>{
      const pool=emojiThemes.filter(x=>x[0]!==other);if(!pool.length)return;
      const id=pool[Math.floor(Math.random()*pool.length)][0];if(online)setOnlineSkin(id);else{if(activePlayer===1)state.skin=id;else state.skin2=id;state.skinCustomized=true;save();render()}
    });
    by('backSkin',()=>{if(state.previous==='victory')showVictory();else if(state.previous==='game')setPage('game');else if(state.previous==='online'){state.page='online';render();save()}else setPage('home')});draw();
  };
  /* Online victory screen: both players must press the rematch button. */
  const baseShowVictory=window.showVictory;
  window.showVictory=function(){
    if(state.mode!=='online'){return baseShowVictory()}
    if(!state.result)return;
    const d=onlineLastSnapshot||{};
    const hostReady=!!d.rematchHost,guestReady=!!d.rematchGuest;
    const meReady=state.onlineRole==='host'?hostReady:guestReady;
    const otherReady=state.onlineRole==='host'?guestReady:hostReady;
    const v=state.result;
    const winner=v==='X'?state.p1:v==='O'?state.p2:null;
    const mark=v==='X'?(emojiMap[state.skin]||'⭕️'):v==='O'?(emojiMap[state.skin2]||'❌'):'—';
    document.getElementById('modalInner').innerHTML=`<div class="victory-mark">${mark}</div><h2 style="text-align:center">${v==='draw'?'引き分け':(winner||'勝利')}！</h2><p style="text-align:center">${v==='draw'?'すべてのマスが埋まりました。':'勝利ラインが揃いました。'}</p>
      <div class="notice" style="text-align:center">${meReady&&otherReady?'2人とも準備完了。次のゲームを開始します。':meReady?'相手の「次のゲームへ」を待っています…':'2人とも「次のゲームへ」を押すと開始します。'}</div>
      <div class="grid"><button class="btn primary" id="again" ${meReady?'disabled':''}>${meReady?'準備完了 ✓':'次のゲームへ'}</button><button class="btn" id="stay">駒を着せ替える</button><button class="btn" id="vrank">ランキングを見る</button><button class="btn" id="vhistory">対局履歴</button><button class="btn danger" id="end">対局を終了</button></div>`;
    document.getElementById('modal').classList.add('show');
    by('again',startRematch);by('stay',()=>{closeModal();state.previous='victory';state.page='skins';render();save()});
    by('vrank',()=>{closeModal();state.previous='victory';state.page='ranking';render();save()});
    by('vhistory',()=>{closeModal();state.previous='victory';state.page='history';render();save()});
    by('end',()=>{closeModal();cleanupOnline();state.onlineRoom=null;state.onlineRole=null;state.result=null;state.active=false;state.board=[];state.page='home';state.previous='home';render();save()});
  };
  /* After both rematch flags are set, host starts the next game and swaps starter. */
  const oldListener=window.onlineRoomListen;
  window.onlineRoomListen=function(){
    cleanupOnline();if(!state.onlineRoom)return;
    onlineRoomRef=window.MARUBATSU_DB.ref('rooms/'+state.onlineRoom);
    onlineRoomHandler=snap=>{
      const d=snap.val();if(!d){cleanupOnline();state.onlineRoom=null;state.onlineRole=null;state.page='setup';render();return}
      onlineLastSnapshot=d;state.size=Number(d.size||3);state.win=Number(d.win||3);state.board=Array.isArray(d.board)?d.board:Object.values(d.board||{});
      state.turn=Number(d.turn||0);state.starter=Number(d.starter||0);state.p1=d.hostName||'';state.p2=d.guestName||'';
      state.skin=d.hostSkin||state.skin||'classicO';state.skin2=d.guestSkin||state.skin2||'classicX';state.active=!!d.active;state.result=d.result||null;winning=Array.isArray(d.winning)?d.winning:[];
      state.timerRemaining=Number(d.timerRemaining??60);state.timerStartedAt=d.timerStartedAt||null;state.onlineConnected=state.onlineRole==='host'?!!d.guestOnline:!!d.hostOnline;
      if(state.active&&state.page==='online')state.page='game';if(state.page==='online'||state.page==='game')render();
      const bothReady=!!d.rematchHost&&!!d.rematchGuest;
      if(bothReady&&state.onlineRole==='host'&&!d.active&&d.result){
        const nextStarter=1-Number(d.starter||0);
        window.MARUBATSU_DB.ref('rooms/'+state.onlineRoom).update({board:Array(state.size*state.size).fill(''),starter:nextStarter,turn:nextStarter,active:true,result:null,winning:[],rematchHost:false,rematchGuest:false,timerRemaining:60,timerStartedAt:firebase.database.ServerValue.TIMESTAMP});
        return;
      }
      if(d.result&&!state._onlineResultShown){state._onlineResultShown=true;setTimeout(showVictory,40)}
      syncClock();
    };
    onlineRoomRef.on('value',onlineRoomHandler);onlinePresenceRef=onlineRoomRef.child(state.onlineRole==='host'?'hostOnline':'guestOnline');onlinePresenceRef.set(true);onlinePresenceRef.onDisconnect().set(false);
  };
})();

<script id="marubatsu-online-presence-replacement">
(function(){
  'use strict';

  let lastOpponentOnline=null;
  let opponentHasBeenOnline=false;
  let presenceBusy=false;
  let noticeElement=null;
  let noticeTimer=null;
  let lastPausedState=null;

  function isOnlineGame(){
    return !!(window.state && state.mode==='online' && state.onlineRoom && window.MARUBATSU_DB);
  }

  function getOpponentOnline(){
    if(!isOnlineGame()) return null;
    return !!state.onlineConnected;
  }

  function hideNotice(){
    if(!noticeElement) return;
    noticeElement.style.opacity='0';
    noticeElement.style.transform='translateX(-50%) translateY(-8px)';
  }

  function showNotice(message,type,persistent){
    if(!noticeElement){
      noticeElement=document.createElement('div');
      noticeElement.id='marubatsu-online-presence';
      noticeElement.style.cssText=[
        'position:fixed','left:50%','top:88px','transform:translateX(-50%) translateY(-8px)',
        'z-index:99999','min-width:250px','max-width:90vw','padding:13px 20px','border-radius:15px',
        'background:rgba(24,32,38,.96)','color:#fff','text-align:center','font-weight:800','font-size:15px',
        'box-shadow:0 10px 35px rgba(0,0,0,.28)','backdrop-filter:blur(10px)','opacity:0',
        'transition:opacity .2s ease,transform .2s ease','pointer-events:none'
      ].join(';');
      document.body.appendChild(noticeElement);
    }

    noticeElement.textContent=message;
    noticeElement.style.border=type==='away'
      ? '1px solid rgba(255,205,110,.55)'
      : '1px solid rgba(120,220,155,.55)';

    clearTimeout(noticeTimer);
    requestAnimationFrame(function(){
      noticeElement.style.opacity='1';
      noticeElement.style.transform='translateX(-50%) translateY(0)';
    });

    if(!persistent){
      noticeTimer=setTimeout(hideNotice,3000);
    }
  }

  function pauseSharedTimer(){
    if(presenceBusy || !isOnlineGame() || !state.active || !onlineLastSnapshot) return;
    presenceBusy=true;

    const ref=window.MARUBATSU_DB.ref('rooms/'+state.onlineRoom);
    ref.transaction(function(room){
      if(!room || !room.active || room.presencePaused) return room;

      let remaining=Number(room.timerRemaining??60);
      if(room.timerStartedAt){
        const startedAt=Number(room.timerStartedAt);
        if(Number.isFinite(startedAt)){
          remaining=Math.max(0,remaining-Math.floor((Date.now()-startedAt)/1000));
        }
      }

      room.timerRemaining=remaining;
      room.timerStartedAt=null;
      room.presencePaused=true;
      room.presencePausedAt=firebase.database.ServerValue.TIMESTAMP;
      return room;
    }).finally(function(){
      presenceBusy=false;
    });
  }

  function resumeSharedTimer(){
    if(presenceBusy || !isOnlineGame() || !state.active || !onlineLastSnapshot) return;
    presenceBusy=true;

    const ref=window.MARUBATSU_DB.ref('rooms/'+state.onlineRoom);
    ref.transaction(function(room){
      if(!room || !room.presencePaused) return room;

      if(!room.active){
        room.presencePaused=false;
        return room;
      }

      if(Number(room.timerRemaining??0)<=0){
        room.presencePaused=false;
        return room;
      }

      room.timerStartedAt=firebase.database.ServerValue.TIMESTAMP;
      room.presencePaused=false;
      room.presenceResumedAt=firebase.database.ServerValue.TIMESTAMP;
      return room;
    }).finally(function(){
      presenceBusy=false;
    });
  }

  function checkPresence(){
    if(!isOnlineGame()){
      lastOpponentOnline=null;
      opponentHasBeenOnline=false;
      lastPausedState=null;
      hideNotice();
      return;
    }

    const online=getOpponentOnline();
    if(online===null) return;

    if(lastOpponentOnline===null){
      lastOpponentOnline=online;
      if(online) opponentHasBeenOnline=true;
      return;
    }

    if(lastOpponentOnline===true && online===false && opponentHasBeenOnline){
      showNotice('💤 相手が離席中です','away',true);
      pauseSharedTimer();
    }

    if(lastOpponentOnline===false && online===true && opponentHasBeenOnline){
      showNotice('✓ 相手が戻ってきました','back',false);
      resumeSharedTimer();
    }

    if(online) opponentHasBeenOnline=true;
    lastOpponentOnline=online;
  }

  function syncPresenceTimerState(){
    if(!window.state || state.mode!=='online' || !onlineLastSnapshot){
      lastPausedState=null;
      return;
    }

    const paused=!!onlineLastSnapshot.presencePaused;
    if(paused!==lastPausedState){
      lastPausedState=paused;
      if(paused) state.timerStartedAt=null;
      if(typeof syncClock==='function') syncClock();
      if(typeof updateTimerDisplay==='function') updateTimerDisplay();
    }
  }

  setInterval(function(){
    try{
      syncPresenceTimerState();
      checkPresence();
    }catch(e){
      console.error('MARUBATSU LINE presence error:',e);
    }
  },300);

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){
      setTimeout(function(){
        try{
          syncPresenceTimerState();
          checkPresence();
        }catch(e){
          console.error(e);
        }
      },400);
    }
  });
})();
</script>
